openapi: 3.1.0
info:
  title: ВСМ-тренажёр проводника
  description: Нелинейные сценарии с таймером, шкалами и очками компетенций.
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Вход по табельному номеру и паролю
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Обменять refresh-токен на новую пару токенов (ротация)
      operationId: refresh_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: 'Выйти: отозвать refresh-токен этого устройства'
      operationId: logout_api_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Logout Api Auth Logout Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenarios:
    get:
      tags:
      - scenarios
      summary: Каталог сценариев
      operationId: list_scenarios_api_scenarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
                type: array
                title: Response List Scenarios Api Scenarios Get
      security:
      - HTTPBearer: []
  /api/scenarios/{scenario_id}/story-map:
    get:
      tags:
      - scenarios
      summary: 'Архив веток: открытые развилки и финалы сотрудника'
      operationId: story_map_api_scenarios__scenario_id__story_map_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryMap'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenarios/schema:
    get:
      tags:
      - scenarios
      summary: JSON-схема файла сценария
      operationId: scenario_schema_api_scenarios_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Scenario Schema Api Scenarios Schema Get
  /api/handbook:
    get:
      tags:
      - handbook
      summary: 'Справочник: ситуации на борту, ролевая модель, классы обслуживания'
      operationId: get_handbook_api_handbook_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handbook'
      security:
      - HTTPBearer: []
  /api/runs:
    post:
      tags:
      - runs
      summary: Начать сценарий (или продолжить незавершённый)
      operationId: start_run_api_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Текущее состояние прохождения
      operationId: get_run_api_runs__run_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/reveal:
    post:
      tags:
      - runs
      summary: 'Сцена дочитана: показать варианты и запустить таймер'
      operationId: reveal_api_runs__run_id__reveal_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/choices:
    post:
      tags:
      - runs
      summary: Выбрать вариант на текущем шаге
      operationId: choose_api_runs__run_id__choices_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoiceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/debrief:
    get:
      tags:
      - runs
      summary: Разбор завершённого сценария
      operationId: debrief_api_runs__run_id__debrief_get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debrief'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/profile:
    get:
      tags:
      - profile
      summary: 'Профиль текущего сотрудника: уровень, компетенции, ачивки, история'
      operationId: get_profile_api_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
      security:
      - HTTPBearer: []
  /api/profile/avatar:
    put:
      tags:
      - profile
      summary: 'Сохранить аватар: фон, головной убор и галстук из готовых вариантов'
      operationId: update_avatar_api_profile_avatar_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Avatar'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/leaderboard:
    get:
      tags:
      - leaderboard
      summary: 'Рейтинг: бригада / депо / компания за неделю / месяц / всё время'
      operationId: leaderboard_api_leaderboard_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          enum:
          - brigade
          - depot
          - company
          type: string
          default: brigade
          title: Scope
      - name: period
        in: query
        required: false
        schema:
          enum:
          - week
          - month
          - all
          type: string
          default: week
          title: Period
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications:
    get:
      tags:
      - notifications
      summary: Уведомления текущего сотрудника (заодно применяет сгорание и выдаёт новые)
      operationId: list_notifications_api_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
      security:
      - HTTPBearer: []
  /api/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      summary: Отметить уведомление прочитанным
      operationId: mark_read_api_notifications__notification_id__read_post
      security:
      - HTTPBearer: []
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Mark Read Api Notifications  Notification Id  Read Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Отметить все уведомления прочитанными
      operationId: mark_all_read_api_notifications_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Mark All Read Api Notifications Read All Post
      security:
      - HTTPBearer: []
  /api/analytics/events:
    post:
      tags:
      - analytics
      summary: Записать действие пользователя на клиенте
      operationId: record_event_api_analytics_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEvent'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Record Event Api Analytics Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/analytics/me:
    get:
      tags:
      - analytics
      summary: Аналитика текущего сотрудника
      operationId: my_analytics_api_analytics_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
      security:
      - HTTPBearer: []
  /api/analytics/team:
    get:
      tags:
      - analytics
      summary: Проводники депо инструктора (только для инструктора)
      operationId: team_api_analytics_team_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamMember'
                type: array
                title: Response Team Api Analytics Team Get
      security:
      - HTTPBearer: []
  /api/analytics/employees/{employee_id}:
    get:
      tags:
      - analytics
      summary: Аналитика проводника своего депо (только для инструктора)
      operationId: employee_analytics_api_analytics_employees__employee_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integration/employees/{personnel_number}:
    get:
      tags:
      - integration
      summary: Профиль компетенций сотрудника (для HR/LMS)
      operationId: competence_profile_api_integration_employees__personnel_number__get
      parameters:
      - name: personnel_number
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4,20}$
          description: Табельный номер
          title: Personnel Number
        description: Табельный номер
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Ключ интеграции
          title: X-Api-Key
        description: Ключ интеграции
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetenceProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - integration
      summary: Создать или обновить сотрудника из HR-системы
      operationId: upsert_employee_api_integration_employees__personnel_number__put
      parameters:
      - name: personnel_number
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4,20}$
          description: Табельный номер
          title: Personnel Number
        description: Табельный номер
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Ключ интеграции
          title: X-Api-Key
        description: Ключ интеграции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpsert'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpsertResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integration/results:
    get:
      tags:
      - integration
      summary: Завершённые прохождения после момента since (для журнала LMS)
      operationId: results_api_integration_results_get
      parameters:
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Вернуть прохождения, завершённые строго позже (ISO 8601 с часовым поясом)
          title: Since
        description: Вернуть прохождения, завершённые строго позже (ISO 8601 с часовым поясом)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Ключ интеграции
          title: X-Api-Key
        description: Ключ интеграции
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunResult'
                title: Response Results Api Integration Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integration/billing/usage:
    get:
      tags:
      - integration
      summary: Объём использования за месяц по депо (для биллинга)
      operationId: billing_usage_api_integration_billing_usage_get
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Календарный месяц по Москве, ГГГГ-ММ
          title: Month
        description: Календарный месяц по Москве, ГГГГ-ММ
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Ключ интеграции
          title: X-Api-Key
        description: Ключ интеграции
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api Health Get
  /api/meta:
    get:
      tags:
      - system
      summary: 'Справочники для интерфейса: компетенции, челлендж недели'
      operationId: meta_api_meta_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Meta Api Meta Get
components:
  schemas:
    AchievementOut:
      properties:
        code:
          type: string
          title: Code
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
      type: object
      required:
      - code
      - title
      - description
      title: AchievementOut
    Analytics:
      properties:
        employee_id:
          type: integer
          title: Employee Id
        full_name:
          type: string
          title: Full Name
        total_runs:
          type: integer
          title: Total Runs
        unfinished_runs:
          type: integer
          title: Unfinished Runs
        completion_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Completion Rate
        avg_decision_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Decision Seconds
        progress:
          items:
            $ref: '#/components/schemas/WeekPoint'
          type: array
          title: Progress
        categories:
          items:
            $ref: '#/components/schemas/CategoryStats'
          type: array
          title: Categories
        competences:
          items:
            $ref: '#/components/schemas/CompetenceStat'
          type: array
          title: Competences
        strengths:
          items:
            type: string
          type: array
          title: Strengths
        weaknesses:
          items:
            type: string
          type: array
          title: Weaknesses
        mistakes:
          items:
            type: string
          type: array
          title: Mistakes
        recommendation:
          anyOf:
          - $ref: '#/components/schemas/Recommendation'
          - type: 'null'
      type: object
      required:
      - employee_id
      - full_name
      - total_runs
      - unfinished_runs
      - completion_rate
      - avg_decision_seconds
      - progress
      - categories
      - competences
      - strengths
      - weaknesses
      - mistakes
      - recommendation
      title: Analytics
    Avatar:
      properties:
        background:
          type: string
          enum:
          - blue
          - mint
          - sand
          - lilac
          - coral
          - night
          title: Background
          default: blue
        headwear:
          type: string
          enum:
          - cap
          - none
          title: Headwear
          default: cap
        tie:
          type: string
          enum:
          - red
          - blue
          - green
          - graphite
          title: Tie
          default: red
      additionalProperties: false
      type: object
      title: Avatar
    BillingUsage:
      properties:
        month:
          type: string
          title: Month
        active_employees:
          type: integer
          title: Active Employees
        runs_completed:
          type: integer
          title: Runs Completed
        depots:
          items:
            $ref: '#/components/schemas/DepotUsage'
          type: array
          title: Depots
      type: object
      required:
      - month
      - active_employees
      - runs_completed
      - depots
      title: BillingUsage
    CategoryStats:
      properties:
        category:
          type: string
          title: Category
        title:
          type: string
          title: Title
        runs:
          type: integer
          title: Runs
        decisions:
          type: integer
          title: Decisions
        timed_steps:
          type: integer
          title: Timed Steps
        success_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Success Rate
        best_choice_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Best Choice Rate
        timeout_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout Rate
        average_reaction_share:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Reaction Share
      type: object
      required:
      - category
      - title
      - runs
      - decisions
      - timed_steps
      - success_rate
      - best_choice_rate
      - timeout_rate
      - average_reaction_share
      title: CategoryStats
    CharacterOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        role:
          type: string
          title: Role
        look:
          additionalProperties:
            anyOf:
            - type: string
            - type: boolean
          type: object
          title: Look
      type: object
      required:
      - id
      - name
      - role
      - look
      title: CharacterOut
    ChoiceOut:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
      type: object
      required:
      - id
      - text
      title: ChoiceOut
    ChoiceRequest:
      properties:
        node_id:
          type: string
          title: Node Id
        choice_id:
          type: string
          title: Choice Id
      type: object
      required:
      - node_id
      - choice_id
