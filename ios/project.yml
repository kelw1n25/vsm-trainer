# Проект Xcode генерируется из этого файла: brew install xcodegen && xcodegen generate
# Сам .xcodeproj в Git не хранится — меньше конфликтов, а настройки видны в одном читаемом файле.
name: VSMTrainer
options:
  bundleIdPrefix: ru.vsm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
packages:
  VSMKit:
    path: VSMKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VSMTrainer:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: VSMKit
        product: VSMFeatures
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vsm.trainer
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        # Симулятор видит backend на localhost; для телефона укажите адрес машины в локальной сети
        Debug:
          API_BASE_URL: "http://localhost:8000"
        # Продакшен — только HTTPS; адрес задаётся при сборке: xcodebuild API_BASE_URL=https://…
        Release:
          API_BASE_URL: "https://vsm-trainer.example.ru"
  VSMTrainerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VSMTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vsm.trainer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VSMTrainer
schemes:
  VSMTrainer:
    build:
      targets:
        VSMTrainer: all
    test:
      targets:
        - VSMTrainerUITests
        - package: VSMKit/VSMCoreTests
