# Запуск: docker compose up --build
# Значения по умолчанию берутся из .env.example (только демо!), свой .env их перекрывает.
x-env: &env
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  db:
    image: postgres:17-alpine
    <<: *env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ — переменные подставляет сам контейнер из env_file, а не docker compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    <<: *env
    ports:
      - "8000:8000"
    # Сценарии и правила игры подключены с диска: правка файла + перезапуск backend, без пересборки
    volumes:
      - ./backend/scenarios:/app/scenarios:ro
      - ./backend/config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
