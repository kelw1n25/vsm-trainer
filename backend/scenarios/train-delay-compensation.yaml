# ДЕМО-КОНТЕНТ: написан командой до получения материалов кейсодержателя.
# Порядок компенсации условный — заменить на правила перевозчика из материалов кейса.
id: train-delay-compensation
title: Задержка поезда и требования компенсации
category: service
difficulty: 2
service_class: Бизнес
route: Москва — Санкт-Петербург
description: >
  Поезд стоит из-за неисправности на пути, группа пассажиров опаздывает на переговоры и требует компенсацию прямо сейчас.
demo: true
initial:
  loyalty: 50
  safety: 85
start_node: start

nodes:
  - id: start
    situation: >
      Поезд стоит уже 40 минут из-за технической неисправности на пути. Группа из восьми
      пассажиров окружила вас в тамбуре.
    line:
      speaker: passenger
      name: Руководитель группы
      text: Мы опаздываем на переговоры! Требуем компенсацию прямо сейчас, иначе пишем в прессу!
    timer_seconds: 25
    timeout_next: crowd_anger
    timeout_effects:
      loyalty: -15
    choices:
      - id: inform_honestly
        text: >
          Представиться, честно рассказать, что известно о задержке, и пообещать узнать
          у начальника поезда порядок компенсации
        effects:
          loyalty: 10
          competences: {communication: 10, service: 5}
        next: info_from_chief
        best: true
        explanation: >
          В неопределённости людей злит отсутствие информации. Честность и обещание,
          которое можно выполнить, снижают накал.
      - id: promise_money
        text: Пообещать всем компенсацию полной стоимости билета
        effects:
          loyalty: 15
          competences: {service: -10, safety_rules: -10}
        next: false_hope
        explanation: >
          Обещание сверх полномочий даёт краткую передышку, но обернётся ещё большим
          недовольством, когда его не выполнят.
      - id: refer_to_hotline
        text: Сказать, что проводник этим не занимается — пусть звонят на горячую линию
        effects:
          loyalty: -20
          competences: {service: -10}
        next: crowd_anger
        explanation: >
          Формально так и есть, но для пассажира проводник — лицо компании. Отказ помочь
          воспринимается как безразличие.

  - id: info_from_chief
    situation: >
      Начальник поезда сообщает: задержка продлится ещё около 20 минут, а компенсация
      оформляется по обращению после поездки.
    line:
      speaker: train_chief
      name: Начальник поезда
      text: Выдай им памятку по обращению и держи в курсе каждые 10 минут.
    timer_seconds: 20
    timeout_next: crowd_anger
    timeout_effects:
      loyalty: -10
    choices:
      - id: explain_procedure
        text: >
          Вернуться к группе, объяснить порядок компенсации, выдать памятку, помочь заполнить
          обращение и предложить воду и зарядку для телефонов
        effects:
          loyalty: 15
          competences: {service: 15, communication: 5}
        next: group_split
        best: true
        explanation: >
          Пассажир получает понятный путь к компенсации и заботу прямо сейчас. Это и есть
          премиальный сервис в нештатной ситуации.
      - id: keep_silent
        text: Не возвращаться к группе, пока поезд не поедет
        effects:
          loyalty: -20
          competences: {communication: -10}
        next: crowd_anger
        explanation: >
          Обещанное обновление информации не пришло. Молчание в стрессовой ситуации
          превращает раздражение в гнев.

  - id: false_hope
    situation: >
      Через полчаса группа требует обещанные деньги. Начальник поезда говорит,
      что таких полномочий у вас не было.
    line:
      speaker: passenger
      name: Руководитель группы
      text: Вы обещали! Где деньги?
    timer_seconds: 20
    timeout_next: crowd_anger
    timeout_effects:
      loyalty: -15
    choices:
      - id: admit_mistake
        text: >
          Признать ошибку, извиниться, объяснить реальный порядок компенсации и помочь
          оформить обращения
        effects:
          loyalty: 5
          competences: {communication: 10, service: 5}
        next: group_split
        best: true
        explanation: >
          Честное признание ошибки восстанавливает доверие лучше, чем попытки оправдаться.
      - id: blame_chief
        text: Сказать, что начальник поезда запретил выплату
        effects:
          loyalty: -15
          competences: {communication: -10}
        next: crowd_anger
        explanation: >
          Перекладывание ответственности на коллегу подрывает доверие ко всему экипажу.

  - id: crowd_anger
    situation: >
      Группа кричит. Один из пассажиров пытается открыть дверь тамбура,
      чтобы выйти на пути.
    timer_seconds: 15
    timeout_next: final_fail
    timeout_effects:
      safety: -30
    choices:
      - id: stop_door
        text: >
          Твёрдо остановить пассажира — выход на пути смертельно опасен, — вызвать начальника
          поезда и дать честную информацию о сроках
        effects:
          loyalty: 5
          safety: 15
          set_flags: [door_incident]
          competences: {safety_rules: 15, stress_resistance: 5}
        next: group_split
        best: true
        explanation: >
          Выход на пути во время стоянки на скоростной магистрали — угроза жизни.
          Здесь нужна твёрдость, а не уговоры.
      - id: let_out
        text: Разрешить выйти подышать — «поезд же всё равно стоит»
        effects:
          safety: -40
          competences: {safety_rules: -20}
        next: final_fail
        explanation: >
          По соседним путям могут идти поезда. Разрешить выход — грубейшее нарушение
          безопасности.

  - id: group_split
    situation: Большинство пассажиров успокоились. Пожилая пассажирка плохо переносит духоту.
    choices:
      - id: care_and_log
        text: >
          Проводить пассажирку в менее заполненный вагон, дать воду, проверить самочувствие
          и отметить задержку в журнале
        effects:
          loyalty: 10
          safety: 5
          competences: {service: 10, first_aid: 5}
        next: final_success
        best: true
        explanation: >
          Проводник замечает самого уязвимого пассажира и не ждёт, пока ему станет плохо.
      - id: report_incident
        condition:
          - flag door_incident
        text: Составить акт о попытке выхода на пути и передать начальнику поезда
        effects:
          safety: 10
          competences: {safety_rules: 10}
        next: final_success
        explanation: >
          Документ нужен для разбора происшествия. Вариант доступен, если попытка выйти была.
      - id: back_to_routine
        text: Вернуться к обычной работе
        effects:
          loyalty: -5
        next: final_partial
        explanation: Пассажирке без внимания становится хуже, её родственники напишут жалобу.

  - id: final_success
    outcome: success
    final_text: >
      Поезд тронулся. Пассажиры знают, как получить компенсацию, и отмечают
      в отзывах заботу экипажа.

  - id: final_partial
    outcome: partial
    final_text: Задержка пережита, но несколько пассажиров написали жалобы на сервис.

  - id: final_fail
    outcome: failure
    final_text: >
      Пассажир вышел на пути. Движение по магистрали остановлено, проводится служебное расследование.
