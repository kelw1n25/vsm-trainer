# СТО РЖД 03.014 «Обслуживание маломобильных пассажиров» и ситуации 14 и 9: посадка пассажирки
# на кресле-коляске, место для коляски занято чужими вещами, пассажир с нарушением слуха.
id: wheelchair-boarding
title: "Посадка пассажирки на кресле-коляске"
category: service
difficulty: 1
service_class: Стандарт
route: Москва — Санкт-Петербург
description: >
  К вагону подъезжает пассажирка на кресле-коляске с чемоданом. Выделенное место уже заставлено чужими сумками,
  а в салоне пассажир с нарушением слуха не слышит объявлений.
situations: [14, 9]
initial:
  loyalty: 70
  safety: 80
stats:
  trust: 40
characters:
  sofia:
    name: "София"
    role: "Пассажирка на кресле-коляске"
    look: {top: "#3E6FD8", bottom: "#34465F", hair: "#2E2622", hair_style: long}
  gleb:
    name: "Глеб"
    role: "Пассажир с нарушением слуха"
    look: {top: "#7BA05B", bottom: "#2F3B55", hair: "#6B3F2A"}
start_node: start

nodes:
  - id: start
    scene:
      background: platform
      characters:
        - {id: player, position: left}
        - {id: sofia, position: right, expression: neutral}
    situation: "К вагону подъезжает пассажирка на кресле-коляске с чемоданом."
    dialogue:
      - {speaker: narrator, text: "До отправления двенадцать минут. К вагону подъезжает пассажирка на кресле-коляске."}
      - {speaker: sofia, text: "Добрый день! Место 3, выделенное. Поможете с подъёмником? И чемодан у меня тяжёлый."}
      - {speaker: player, thought: true, text: "Сначала спросить, какая помощь ей нужна, — а не решать за неё."}
    choices:
      - id: ask_needs
        text: "Уточнить, какая помощь нужна, подготовить подъёмное устройство и рассказать, как проедем до её места"
        effects:
          loyalty: 15
          safety: 10
          stats: {trust: 20}
          competences: {service: 15, communication: 5}
        reaction:
          - {speaker: sofia, expression: happy, text: "Спасибо, что спросили. Коляску я веду сама, а чемодан — если можно, вы."}
        next: placement
        best: true
        explanation: >
          Получить от пассажира информацию, нужную для безопасной помощи, построить маршрут до места и помочь с
          техническим оборудованием и багажом — требования стандарта к персоналу.
      - id: grab_chair
        text: "Сразу взяться за коляску и закатить её в вагон самому"
        effects:
          safety: -10
          stats: {trust: -15}
          competences: {communication: -10}
        reaction:
          - {speaker: sofia, expression: annoyed, text: "Подождите! Не надо меня толкать, я сама управляю."}
        next: placement
        explanation: "Помощь без вопроса лишает человека контроля и может быть небезопасной. Сначала — спросить."
      - id: wait_others
        text: "Попросить подождать, пока зайдут остальные пассажиры"
        effects:
          loyalty: -15
          competences: {service: -10}
        reaction:
          - {speaker: sofia, expression: sad, text: "Опять ждать в конце… Ладно."}
        next: placement
        explanation: "Маломобильному пассажиру помогают так же своевременно, как остальным, а не в последнюю очередь."

  - id: placement
    scene:
      background: salon
      characters:
        - {id: player, position: left}
        - {id: sofia, position: right, expression: worried}
    situation: "Место для кресла-коляски заставлено чужими сумками."
    dialogue:
      - {speaker: narrator, text: "Выделенное место для кресла-коляски занято: там стоят два чужих чемодана и рюкзак."}
      - {speaker: sofia, text: "Ну вот. Каждый раз одно и то же."}
      - {speaker: player, thought: true, text: "Найти владельцев. И назвать конкретное место для их вещей."}
    choices:
      - id: clear_space
        text: >
          Найти владельцев: «В целях безопасности это место должно оставаться свободным. В конце вагона есть
          специальное место для багажа — позвольте, я помогу переставить»
        effects:
          safety: 15
          loyalty: 10
          stats: {trust: 10}
          competences: {safety_rules: 10, service: 10}
        reaction:
          - {speaker: sofia, expression: happy, text: "Спасибо. И куртку повесьте, пожалуйста, пониже — чтобы я дотянулась."}
        next: hearing
        best: true
        explanation: >
          Владельцев находят опросом, просят переставить вещи с акцентом на безопасности и указывают конкретное место.
          Вещи пассажирки размещают там, где она сама до них дотянется.
      - id: squeeze
        text: "Поставить коляску рядом, в проходе, — места же нет"
        effects:
          safety: -20
          set_flags: [mistake_made]
          competences: {safety_rules: -15}
        next: end_incident
        explanation: "Коляска в проходе перекрывает путь эвакуации. Выделенное место освобождают от чужих вещей."
      - id: offer_transfer
        text: "Спросить, не хочет ли София пересесть в кресло, а коляску сложить в отведённом месте — если ей так удобнее"
        condition: ["trust >= 55"]
        effects:
          safety: 10
          loyalty: 15
          competences: {service: 15}
        reaction:
          - {speaker: sofia, expression: happy, text: "Да, в кресле у окна мне даже удобнее. Спасибо, что предложили, а не решили за меня."}
        next: hearing
        explanation: "Стандарт предусматривает проезд на пассажирском месте со сложенной коляской — но только по желанию пассажира."

  - id: hearing
    scene:
      background: salon
      characters:
        - {id: player, position: left}
        - {id: gleb, position: right, expression: worried}
    situation: "Пассажир с нарушением слуха не слышит объявлений и спрашивает текстом, какая следующая станция."
    dialogue:
      - {speaker: narrator, text: "В пути к вам подходит молодой человек и показывает экран телефона."}
      - {speaker: narrator, text: "На экране: «Я не слышу объявлений. Какая следующая станция? Мне в Тверь»."}
      - {speaker: player, thought: true, text: "Объявления он не услышит. Нужен другой канал."}
    choices:
      - id: text_reply
        text: "Ответить текстом на планшете в удобном ему темпе и пообещать подойти заранее перед Тверью"
        effects:
          loyalty: 15
          stats: {trust: 10}
          competences: {communication: 15}
        reaction:
          - {speaker: gleb, expression: happy, text: "(набирает) Спасибо! Буду ждать."}
        next: meal
        best: true
        explanation: "Использовать альтернативные способы коммуникации — планшет, смартфон, текст — в темпе, приемлемом для пассажира."
      - id: speak_louder
        text: "Говорить громче и медленнее"
        effects:
          loyalty: -10
          competences: {communication: -10}
        reaction:
          - {speaker: gleb, expression: sad, text: "(качает головой и снова показывает экран)"}
        next: meal
        explanation: "Громкость не помогает пассажиру с нарушением слуха. Нужен текстовый канал."

  - id: meal
    scene:
      background: salon
      characters:
        - {id: player, position: left}
        - {id: sofia, position: right, expression: neutral}
    situation: "Пассажирка на коляске хочет пообедать, но дойти до вагона-бистро ей сложно."
    dialogue:
      - {speaker: sofia, text: "Я бы пообедала, но до бистро через три вагона на коляске — целое приключение."}
    choices:
      - id: order_to_seat
        text: "Предложить заказ питания на место и принести меню бистро"
        effects:
          loyalty: 15
          competences: {service: 15}
        reaction:
          - {speaker: sofia, expression: happy, text: "А так можно? Отлично! Тогда суп и чай."}
        next: end_success
        best: true
        explanation: "Маломобильным пассажирам, которым трудно передвигаться, должна быть доступна доставка питания на место."
      - id: point_bistro
        text: "Подсказать, в каком вагоне бистро"
        effects:
          loyalty: -10
          competences: {service: -5}
        next: end_partial
        explanation: "Подсказка формально верна, но стандарт требует предложить заказ питания на пассажирское место."

  - id: end_success
    scene:
      background: salon
      characters:
        - {id: player, position: left, expression: happy}
        - {id: sofia, position: right, expression: happy}
    outcome: success
    ending: "Доступная поездка без барьеров"
    final_text: >
      Проводник спросил, какая помощь нужна, освободил выделенное место, нашёл общий язык с пассажиром с нарушением
      слуха и организовал обед на месте. Спокойная и доброжелательная обстановка — главное требование стандарта.
  - id: end_partial
    scene:
      background: salon
      characters:
        - {id: player, position: left, expression: worried}
    outcome: partial
    ending: "Поездка состоялась, но с барьерами"
    final_text: >
      Пассажиры доехали, но им пришлось ждать, объяснять или справляться самим там, где проводник мог помочь.
  - id: end_incident
    scene:
      background: salon
      characters:
        - {id: player, position: left, expression: sad}
        - {id: sofia, position: right, expression: sad}
    outcome: failure
    ending: "Перекрыт путь эвакуации"
    final_text: >
      Коляска в проходе перекрыла путь эвакуации — при проверке бригада получила замечание, а пассажирка ехала
      в неудобном и небезопасном месте.
