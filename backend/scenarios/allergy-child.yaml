# ДЕМО-КОНТЕНТ: написан командой до получения материалов кейсодержателя.
# Алгоритм действий упрощён для тренажёра и не заменяет обучение первой помощи.
id: allergy-child
title: Аллергическая реакция у ребёнка
category: medical
difficulty: 2
service_class: Эконом
route: Москва — Санкт-Петербург
description: >
  После перекуса у ребёнка появились сыпь и кашель, мама в растерянности.
  Счёт идёт на минуты: нужно не допустить отёка и помочь правильно применить лекарство.
demo: true
initial:
  loyalty: 70
  safety: 75
start_node: start

nodes:
  - id: start
    situation: >
      Мама зовёт на помощь: у мальчика лет шести после перекуса покраснело лицо,
      появилась сыпь, он часто кашляет.
    line:
      speaker: passenger
      name: Мама мальчика
      text: Он съел печенье, там, наверное, были орехи!
    timer_seconds: 15
    timeout_next: swelling
    timeout_effects:
      safety: -20
    choices:
      - id: assess_and_call
        text: >
          Спросить про аллергию и лекарства, усадить ребёнка, сообщить начальнику поезда
          и объявить поиск медика
        effects:
          safety: 10
          loyalty: 5
          set_flags: [chief_informed]
          competences: {first_aid: 10, communication: 5}
        next: mom_has_meds
        best: true
        explanation: >
          Два главных вопроса — есть ли известная аллергия и назначенное лекарство.
          Параллельно запускается цепочка помощи.
      - id: give_water
        text: Дать воды и сказать, что сейчас всё пройдёт
        effects:
          safety: -15
          competences: {first_aid: -5}
        next: swelling
        explanation: Аллергическая реакция может быстро перейти в отёк — ждать нельзя.
      - id: own_pills
        text: Дать таблетку от аллергии из аптечки поезда
        effects:
          safety: -10
          competences: {first_aid: -5, safety_rules: -10}
        next: swelling
        explanation: >
          Проводник не назначает лекарства детям: дозировка и противопоказания —
          решение медика или назначение врача, которое есть у родителей.

  - id: mom_has_meds
    situation: >
      У мамы есть автоинжектор с адреналином, назначенный врачом, но она растерялась
      и не решается сделать укол.
    timer_seconds: 15
    timeout_next: swelling
    timeout_effects:
      safety: -15
    choices:
      - id: guide_mom
        text: >
          Спокойно помочь маме: прочитать инструкцию вслух и поддержать ребёнка,
          чтобы она сама сделала укол
        effects:
          safety: 20
          competences: {first_aid: 15, communication: 5, stress_resistance: 5}
        next: stabilizing
        best: true
        explanation: >
          Препарат назначен врачом, и применяет его родитель. Проводник помогает
          спокойствием и чёткими подсказками.
      - id: wait_doctor
        text: Ждать, пока найдётся медик среди пассажиров
        effects:
          safety: -15
        next: swelling
        explanation: Когда лекарство под рукой, промедление опаснее самого укола.

  - id: swelling
    situation: Губы и лицо ребёнка отекают, дыхание становится хриплым.
    timer_seconds: 10
    timeout_next: final_fail
    timeout_effects:
      safety: -30
    choices:
      - id: urgent_chief
        text: >
          Немедленно по рации сообщить об экстренной ситуации, запросить остановку и скорую,
          помочь маме достать лекарства
        effects:
          safety: 15
          set_flags: [chief_informed]
          competences: {first_aid: 10, stress_resistance: 5}
        next: mom_has_meds
        best: true
        explanation: При нарастающем отёке нужны одновременно лекарство и экстренная медицинская помощь.
      - id: panic_announce
        text: Громко крикнуть на весь вагон «Ребёнку плохо, помогите кто-нибудь!»
        effects:
          safety: -5
          loyalty: -10
          competences: {communication: -5}
        next: mom_has_meds
        explanation: >
          Паника передаётся маме и ребёнку. Помощь ищут через объявление по связи,
          спокойно и с чёткой просьбой.

  - id: stabilizing
    situation: >
      Отёк уменьшается, ребёнок дышит ровнее. Начальник поезда спрашивает, нужна ли остановка.
    line:
      speaker: train_chief
      name: Начальник поезда
      text: Доложи, что с ребёнком. Нужна скорая?
    timer_seconds: 20
    timeout_next: final_partial
    timeout_effects:
      safety: -10
    choices:
      - id: request_ambulance
        text: >
          Попросить скорую к ближайшей станции: после укола адреналина ребёнка обязательно
          должны осмотреть врачи
        effects:
          safety: 10
          loyalty: 5
          competences: {first_aid: 10, safety_rules: 10}
        next: final_success
        best: true
        explanation: Действие адреналина временное, реакция может вернуться — нужен осмотр врача.
      - id: report_details
        condition:
          - flag chief_informed
        text: >
          Доложить, что и когда съел ребёнок, какие были симптомы и во сколько сделан укол, —
          начальник поезда передаст это скорой
        effects:
          safety: 10
          competences: {communication: 10, first_aid: 5}
        next: final_success
        explanation: >
          Точная хронология помогает врачам. Вариант доступен, если начальник поезда
          в курсе ситуации с самого начала.
      - id: no_stop_needed
        text: Сказать, что всё прошло и скорая не нужна
        effects:
          loyalty: 5
          safety: -20
          competences: {safety_rules: -10}
        next: final_partial
        explanation: Пассажиры рады, что поезд не задерживается, но ребёнок остаётся без осмотра.

  - id: final_success
    outcome: success
    final_text: Ребёнка осмотрели врачи на станции, опасность миновала. Мама благодарит экипаж.

  - id: final_partial
    outcome: partial
    final_text: Реакцию удалось остановить, но ребёнок доехал без осмотра врача. Будет разбор случая.

  - id: final_fail
    outcome: failure
    final_text: Помощь опоздала, ребёнка экстренно госпитализировали. Проводится служебная проверка.
