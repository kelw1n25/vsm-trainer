# ДЕМО-КОНТЕНТ: написан командой до получения материалов кейсодержателя.
id: noisy-group-night
title: Шумная компания ночью
category: conflict
difficulty: 1
service_class: Эконом
route: Москва — Санкт-Петербург
description: >
  Поздний рейс, в вагоне приглушён свет и большинство пассажиров спит, а компания громко
  празднует. Соседи просят вмешаться — нужно вернуть тишину и никого не обидеть.
demo: true
initial:
  loyalty: 60
  safety: 90
start_node: start

nodes:
  - id: start
    situation: >
      23:40, поздний рейс. В вагоне приглушён свет, большинство пассажиров спит, но компания
      из четырёх человек громко смеётся и включила музыку на колонке. Пожилой пассажир и мама
      с младенцем просят вас вмешаться.
    line:
      speaker: passenger
      name: Пожилой пассажир
      text: Уже почти полночь, ребёнок только уснул — сделайте что-нибудь!
    timer_seconds: 25
    timeout_next: complaints
    timeout_effects:
      loyalty: -15
    choices:
      - id: polite_request
        text: >
          Подойти к компании, говорить вполголоса, напомнить, что в вагоне спят, и предложить
          продолжить общение в вагоне-бистро — он работает до 01:00
        effects:
          loyalty: 10
          competences: {communication: 10, service: 5}
        next: reaction
        best: true
        explanation: >
          Вежливая просьба с альтернативой не ставит компанию в позицию нарушителей:
          им предлагают место, где можно праздновать дальше.
      - id: loud_remark
        text: Сделать замечание громко, на весь вагон
        effects:
          loyalty: -10
          competences: {communication: -5}
        next: pushback
        explanation: >
          Громкое замечание будит тех, кто ещё спал, и задевает самолюбие компании —
          она начинает защищаться. Ночью разговор ведут тихо и рядом с людьми.
      - id: move_complainers
        text: Предложить пожаловавшимся пересесть в другой вагон
        effects:
          loyalty: -10
          competences: {service: -5}
        next: complaints
        explanation: >
          Пассажиры, которые соблюдают ночную тишину, наказаны за чужой шум, а спящим
          в вагоне это никак не поможет.

  - id: reaction
    situation: Компания нехотя выключает музыку, но один из пассажиров спорит.
    line:
      speaker: passenger
      name: Пассажир из компании
      text: Мы тоже заплатили за билеты! Где написано, что ночью нельзя разговаривать?
    timer_seconds: 20
    timeout_next: pushback
    timeout_effects:
      loyalty: -10
    choices:
      - id: explain_rules
        text: >
          Спокойно объяснить правило ночной тишины с 23:00 из правил перевозки и ещё раз
          предложить бистро — там можно общаться, никому не мешая
        effects:
          loyalty: 10
          set_flags: [rules_explained]
          competences: {communication: 10, safety_rules: 5}
        next: bistro
        best: true
        explanation: >
          Ссылка на понятное правило снимает ощущение личной претензии, а повторное
          предложение бистро оставляет компании выход без потери лица.
      - id: allow_talking
        text: Разрешить разговаривать, если выключат музыку
        effects:
          loyalty: -5
        next: partial_calm
        explanation: >
          Компромисс за счёт спящих пассажиров: громкие разговоры ночью мешают не меньше
          музыки, жалобы остаются.
      - id: threaten_fine
        text: Пригрозить штрафом и высадкой на ближайшей станции
        effects:
          loyalty: -15
          competences: {communication: -10}
        next: pushback
        explanation: Угроза несоразмерна нарушению и провоцирует открытый конфликт.

  - id: pushback
    situation: >
      Компания возмущается, один из пассажиров встаёт и повышает голос на проводника.
      Соседи недовольны уже всеми.
    timer_seconds: 15
    timeout_next: final_fail
    timeout_effects:
      loyalty: -20
    choices:
      - id: deescalate
        text: >
          Сменить тон: признать, что у компании праздник, и пригласить их в бистро
          на чай за счёт перевозчика
        effects:
          loyalty: 15
          competences: {communication: 10, service: 10}
        next: bistro
        best: true
        explanation: >
          Признание чувств собеседника и небольшой сервисный жест быстро гасят спор.
          Проводник остаётся хозяином ситуации.
      - id: call_chief_noise
        text: Вызвать начальника поезда
        effects:
          loyalty: -5
          competences: {safety_rules: 5}
        next: partial_calm
        explanation: >
          Допустимо, но для шумной компании это преждевременно: спор можно было
          решить самому.

  - id: complaints
    situation: Пожаловавшиеся пассажиры пишут жалобу в приложении, шум продолжается.
    timer_seconds: 20
    timeout_next: final_fail
    timeout_effects:
      loyalty: -10
    choices:
      - id: finally_act
        text: Извиниться перед пожаловавшимися и всё-таки подойти к компании с вежливой просьбой
        effects:
          loyalty: 5
          competences: {communication: 5}
        next: reaction
        best: true
        explanation: Лучше поздно исправить ситуацию, чем оставить жалобу без ответа.
      - id: offer_earplugs
        text: Раздать беруши пожаловавшимся и оставить всё как есть
        effects:
          loyalty: -5
          competences: {service: 5}
        next: final_partial
        explanation: Забота видна, но причина жалобы не устранена.

  - id: partial_calm
    situation: Музыку выключили, но разговоры громкие. Часть пассажиров всё ещё недовольна.
    choices:
      - id: propose_bistro
        text: Предложить компании перейти в бистро
        effects:
          loyalty: 10
          competences: {communication: 5}
        next: bistro
        best: true
        explanation: Возврат к лучшему решению — у компании появляется место для праздника.
      - id: leave_it
        text: Оставить всё как есть
        effects:
          loyalty: -5
        next: final_partial
        explanation: Проблема осталась наполовину решённой.

  - id: bistro
    situation: Компания переходит в вагон-бистро. В вагоне снова тихо.
    choices:
      - id: thank_both
        condition:
          - flag rules_explained
        text: Поблагодарить компанию за понимание и сообщить пожилому пассажиру, что вопрос решён
        effects:
          loyalty: 15
          competences: {communication: 5, service: 5}
        next: final_success
        best: true
        explanation: >
          Проводник закрывает ситуацию для обеих сторон. Вариант доступен, если правило
          было объяснено, а не навязано.
      - id: back_to_work
        text: Вернуться к своим делам
        effects:
          loyalty: 5
        next: final_success
        explanation: В вагоне снова спят, но пассажиры не узнали, что их просьбу услышали.

  - id: final_success
    outcome: success
    final_text: В вагоне тишина, компания довольна бистро, пожаловавшиеся благодарят экипаж.

  - id: final_partial
    outcome: partial
    final_text: Шум стал тише, но жалоба на сервис всё же поступила.

  - id: final_fail
    outcome: failure
    final_text: Конфликт разросся, в вагоне скандал, несколько пассажиров написали жалобы.
