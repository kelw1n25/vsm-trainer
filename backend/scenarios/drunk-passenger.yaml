# Ситуации 6, 21, 50 и 24: пассажир с признаками опьянения распивает алкоголь в салоне,
# просит принести ещё и грубит проводнику.
id: drunk-passenger
title: "Пассажир в состоянии опьянения"
category: conflict
difficulty: 2
service_class: Стандарт
route: Москва — Санкт-Петербург
description: >
  Вечерний рейс. Пассажир у окна открыл бутылку, говорит всё громче,
  а его соседка всё чаще оглядывается в поисках помощи.
situations: [6, 21, 50, 24]
initial:
  loyalty: 70
  safety: 70
stats:
  trust: 30
  tension: 40
characters:
  gennady:
    name: "Геннадий"
    role: "Пассажир"
    look: {top: "#4F7F52", bottom: "#34405A", hair: "#3A2E2A"}
  irina:
    name: "Ирина"
    role: "Соседка по ряду"
    look: {top: "#E0A0B4", bottom: "#3A3550", hair: "#2B2320", hair_style: long}
  chief:
    name: "Ольга Николаевна"
    role: "Начальник поезда"
    look: {outfit: uniform, hair: "#4A3426", hair_style: bun}
  roman:
    name: "Роман"
    role: "Сотрудник ПТБ"
    look: {top: "#2E3A4F", bottom: "#1E2636", hair: "#1F1A17"}
start_node: start

nodes:
  - id: start
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left}
        - {id: gennady, position: center, expression: tipsy, pose: sit, hand: hold, item: bottle}
        - {id: irina, position: right, expression: worried, pose: sit}
    situation: "Пассажир с признаками опьянения распивает принесённый алкоголь в салоне, соседке некомфортно."
    dialogue:
      - {speaker: narrator, text: "Вечерний рейс. В салоне приглушённый свет, большинство пассажиров отдыхает."}
      - {speaker: gennady, text: "Ну что, за хорошую дорогу! Девушка, может, с нами?"}
      - {speaker: narrator, text: "Он громко смеётся и стучит бутылкой по столику. Ирина вздрагивает."}
      - {speaker: irina, text: "Нет, спасибо… Я лучше почитаю.", sound: sigh}
      - {speaker: player, thought: true, text: "Он пьёт своё в салоне. Нужно сказать спокойно — и так, чтобы слышал только он."}
    choices:
      - id: remind_rule
        text: >
          Подойти и негромко сказать: «Обращаю Ваше внимание — употребление алкогольных напитков допускается только
          в вагоне-бистро»
        effects:
          safety: 10
          stats: {tension: -10, trust: 10}
          competences: {communication: 10, safety_rules: 5}
        reaction:
          - {speaker: gennady, expression: thinking, text: "Только в бистро? Ну ладно, ладно, убираю…"}
        next: asks_for_more
        best: true
        explanation: >
          Напомнить правило вежливо и индивидуально, не привлекая внимания салона. Спокойный тон снижает риск
          агрессии.
      - id: take_bottle
        text: "Молча забрать бутылку со столика"
        effects:
          loyalty: -15
          stats: {tension: 30, trust: -20}
          set_flags: [conflict_started]
          competences: {communication: -10}
        reaction:
          - {speaker: gennady, expression: angry, text: "Эй! Ты что себе позволяешь?! Верни сейчас же!"}
        next: rude
        explanation: "Изъятие вещей без слов воспринимается как нападение и провоцирует агрессию. Сначала — правило словами."
      - id: ignore
        text: "Не обращать внимания — пусть отдыхает, лишь бы не шумел"
        effects:
          loyalty: -10
          safety: -10
          stats: {tension: 15}
          competences: {safety_rules: -5}
        next: escalation
        explanation: "Нарушение без внимания нарастает. Соседка и другие пассажиры ждут, что проводник вмешается."

  - id: asks_for_more
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left}
        - {id: gennady, position: right, expression: tipsy, pose: sit}
    situation: "Нетрезвый пассажир просит принести ему алкоголь из вагона-бистро."
    dialogue:
      - {speaker: gennady, text: "Слушай, раз тут нельзя — принеси мне коньячку из бистро. Я заплачу, не вопрос."}
      - {speaker: player, thought: true, text: "Он едва держит стакан. Запретить покупку в бистро я не могу, но приносить не буду."}
    choices:
      - id: refuse_offer_tea
        text: "«К сожалению, я не могу предоставить Вам этот напиток. Позвольте предложить Вам чай или кофе?»"
        effects:
          loyalty: 5
          safety: 10
          stats: {trust: 10, tension: -5}
          competences: {communication: 10, service: 5}
        reaction:
          - {speaker: gennady, expression: neutral, text: "Чай… Ну давай чай. С лимоном."}
        next: report_chief
        best: true
        explanation: >
          Вежливо отказать и сразу предложить альтернативу. При угрозе конфликта обязательно сообщить начальнику
          поезда — решение об ограничении продажи принимает он.
      - id: bring_cognac
        text: "Принести — в бистро ведь продают"
        effects:
          safety: -20
          set_flags: [mistake_made]
          competences: {safety_rules: -10}
        reaction:
          - {speaker: gennady, expression: happy, text: "Вот это сервис! Ещё одну, а?"}
        next: escalation
        explanation: "Приносить алкоголь пассажиру с признаками опьянения — значит увеличивать риск конфликта и угрозу для других."
      - id: lecture
        text: "«Вам уже хватит, честное слово»"
        effects:
          loyalty: -10
          stats: {tension: 25, trust: -10}
          competences: {communication: -5}
        reaction:
          - {speaker: gennady, expression: angry, text: "Ты мне ещё указывать будешь, сколько мне хватит?"}
        next: rude
        explanation: "Оценочные фразы задевают и провоцируют. Отказ звучит нейтрально — и с альтернативой."

  - id: rude
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left}
        - {id: gennady, position: center, expression: angry, pose: sit, hand: hold, item: bottle}
        - {id: irina, position: right, expression: worried, pose: sit}
    situation: "Пассажир грубит проводнику и повышает голос на весь вагон."
    dialogue:
      - {speaker: gennady, text: "Ты кто такой вообще, а? Обслуга! Иди куда шёл!"}
      - {speaker: narrator, text: "Пассажиры вокруг оборачиваются. Ирина вжимается в кресло."}
      - {speaker: player, thought: true, text: "Не спорить. Держать дистанцию. Не дать ему завестись."}
    timer_seconds: 20
    timeout_next: escalation
    timeout_effects: {safety: -15, stats: {tension: 15}}
    timeout_reaction:
      - {speaker: gennady, expression: angry, text: "Чего молчишь? Испугался?!"}
    choices:
      - id: set_boundary
        text: "Сохраняя дистанцию, ровным голосом — «Я готов помочь Вам, но прошу общаться корректно»"
        effects:
          safety: 10
          stats: {tension: -15, trust: 5}
          competences: {communication: 10, stress_resistance: 10}
        reaction:
          - {speaker: gennady, expression: serious, text: "…Ладно. Чего ты хотел-то?"}
        next: report_chief
        best: true
        explanation: "Спокойно обозначить правило поведения и не вступать в спор — так грубость не получает подпитки."
      - id: argue_back
        text: "Ответить в тон: «Сам иди! Сейчас полицию вызову»"
        effects:
          loyalty: -20
          safety: -15
          stats: {tension: 30}
          set_flags: [conflict_started]
          competences: {communication: -15}
        next: end_conflict
        explanation: "Ответная грубость и угрозы — прямой путь к драке. Проводник держится достойно, даже когда с ним грубы."
      - id: switch_to_tea
        text: "Он почти остыл — спокойно переключить разговор на чай и дорогу"
        condition: ["tension < 50"]
        effects:
          loyalty: 10
          stats: {tension: -20}
          competences: {communication: 10}
        reaction:
          - {speaker: gennady, expression: sad, text: "Да… Чаю бы. День тяжёлый был, понимаешь.", sound: sigh_male}
        next: report_chief
        explanation: "Когда напряжение невысокое, мягкое переключение внимания помогает — но начальника поезда всё равно информируют."

  - id: escalation
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left}
        - {id: gennady, position: center, expression: angry, pose: sit, hand: hold, item: bottle}
        - {id: irina, position: right, expression: pained, pose: sit}
    situation: "Нетрезвый пассажир кричит на соседку; нужна помощь начальника поезда и ПТБ."
    dialogue:
      - {speaker: narrator, text: "Геннадий уже кричит. Ирина пытается встать, но он загораживает ей проход."}
      - {speaker: irina, text: "Пожалуйста, выпустите меня!"}
      - {speaker: player, thought: true, text: "Одному тут не справиться. Но по рации — осторожно, он услышит."}
    timer_seconds: 15
    timeout_next: end_incident
    timeout_effects: {safety: -25}
    timeout_reaction:
      - {speaker: narrator, text: "Геннадий хватает Ирину за рукав. Она вскрикивает."}
    choices:
      - id: radio_neutral
        text: "Вызвать начальника поезда и ПТБ по рации, не называя пассажира пьяным: «Прошу подойти в пятый вагон, требуется помощь»"
        effects:
          safety: 15
          stats: {tension: -5}
          set_flags: [security_called, chief_informed]
          competences: {safety_rules: 15, stress_resistance: 5}
        next: security_arrives
        best: true
        explanation: >
          Сообщить начальнику поезда и ПТБ обязательно. При вызове по рации не говорят, что пассажир пьян, —
          чтобы не спровоцировать агрессию.
      - id: radio_explicit
        text: "По рации, громко: «Тут пьяный буянит, срочно сюда!»"
        effects:
          safety: 5
          stats: {tension: 25}
          set_flags: [security_called, chief_informed]
          competences: {safety_rules: 5, communication: -10}
        reaction:
          - {speaker: gennady, expression: angry, text: "Кто пьяный?! Я пьяный?!"}
        next: security_arrives
        explanation: "Помощь вызвана, но слово «пьяный» он услышал — и агрессия выросла."
      - id: handle_alone
        text: "Встать между ними и попытаться утихомирить его самому"
        effects:
          safety: -25
          competences: {safety_rules: -10}
        next: end_incident
        explanation: "В одиночку с агрессивным пассажиром проводник рискует собой и другими. Сначала — вызвать начальника и ПТБ."

  - id: report_chief
    scene:
      background: staff_room
      characters:
        - {id: player, position: left}
    situation: "Пассажир успокоился; остаётся решить, сообщать ли начальнику поезда."
    dialogue:
      - {speaker: narrator, text: "Геннадий пьёт чай и смотрит в окно. В служебном купе тихо."}
      - {speaker: player, thought: true, text: "Вроде обошлось. Но через час в бистро всё может начаться снова."}
    choices:
      - id: quiet_report
        text: "Сообщить начальнику поезда нейтрально: «В пятом вагоне пассажиру требуется внимание, место 12»"
        effects:
          safety: 10
          set_flags: [chief_informed]
          competences: {safety_rules: 10}
        next: end_calm
        best: true
        explanation: "Начальника поезда информируют обязательно и любым способом связи — даже если пассажир на время успокоился."
      - id: skip_report
        text: "Не беспокоить начальника — пассажир успокоился"
        effects:
          safety: -10
          competences: {safety_rules: -10}
        next: end_partial
        explanation: "Без информации начальник поезда не сможет принять решение о продаже алкоголя в бистро и вовремя вмешаться."

  - id: security_arrives
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left}
        - {id: chief, position: center, expression: serious}
        - {id: roman, position: right, expression: serious}
    situation: "Начальник поезда и сотрудник ПТБ прибыли и просят доложить."
    dialogue:
      - {speaker: chief, text: "Что произошло? Коротко."}
      - {speaker: roman, text: "Пассажира я беру на себя. Где пострадавшие?"}
    choices:
      - id: facts_and_care
        text: "Доложить факты и позаботиться об Ирине — предложить ей место в другом вагоне и воды"
        effects:
          loyalty: 15
          safety: 10
          competences: {communication: 10, service: 5}
        reaction:
          - {speaker: chief, expression: neutral, text: "Хорошо. Пассажира сопроводим до станции. Спасибо за чёткий доклад."}
        next: end_team
        best: true
        explanation: "Короткий доклад по фактам и внимание к пострадавшей соседке — так бригада восстанавливает порядок и доверие."
      - id: demand_police
        text: "Потребовать немедленно высадить его и сдать полиции"
        effects:
          loyalty: -5
          competences: {communication: -5}
        reaction:
          - {speaker: chief, expression: serious, text: "Решение о передаче полиции принимаю я. Сейчас — займитесь соседкой."}
        next: end_team_partial
        explanation: "Передать нарушителя полиции вправе начальник поезда. Задача проводника — доклад и забота о других пассажирах."

  - id: end_calm
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: happy}
        - {id: irina, position: right, expression: happy, pose: sit}
    outcome: success
    ending: "Порядок сохранён без конфликта"
    final_text: >
      Правило прозвучало спокойно, отказ — с альтернативой, грубость не получила ответа. Начальник поезда в курсе
      и держит ситуацию под контролем. Ирина спокойно дочитала книгу.
  - id: end_team
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: neutral}
        - {id: chief, position: right, expression: neutral}
    outcome: success
    ending: "Порядок восстановлен силами бригады"
    final_text: >
      Когда ситуация вышла за рамки разговора, проводник вовремя вызвал начальника поезда и ПТБ, не спровоцировав
      пассажира. Соседке помогли, салон успокоился.
  - id: end_team_partial
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: worried}
        - {id: chief, position: right, expression: serious}
    outcome: partial
    ending: "Потребовалось вмешательство начальника поезда"
    final_text: >
      Нарушитель под контролем, но проводник занялся не своим решением и едва не забыл о пострадавшей пассажирке.
  - id: end_partial
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: worried}
    outcome: partial
    ending: "Пассажир успокоился, но начальник поезда не в курсе"
    final_text: >
      Сейчас всё тихо, но без доклада начальник поезда не знает о рисках в вагоне. Через час ситуация может
      повториться в бистро.
  - id: end_conflict
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: sad}
        - {id: gennady, position: right, expression: angry, pose: sit}
    outcome: failure
    ending: "Конфликт с пассажиром"
    final_text: >
      Перепалка с нетрезвым пассажиром переросла в скандал на весь вагон. Пассажиры записали видео, поступили жалобы.
  - id: end_incident
    scene:
      background: salon_evening
      characters:
        - {id: player, position: left, expression: sad}
        - {id: irina, position: right, expression: pained, pose: sit}
    outcome: failure
    ending: "Ситуация переросла в серьёзный инцидент"
    final_text: >
      Помощь пришла слишком поздно: пассажирка пострадала от агрессивного соседа. Проводится служебная проверка.
