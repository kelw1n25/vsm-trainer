# Ситуации 33, 13, 9, 8 и 23: два пассажира на одно место, пассажир не на своём месте,
# спор между пассажирами, пересадка и повышение класса обслуживания.
id: business-seat-conflict
title: "Два пассажира на одно место"
category: conflict
difficulty: 2
service_class: Бизнес
route: Москва — Санкт-Петербург
description: >
  В кресле 5А сидит пассажирка, а рядом стоит пассажир с билетом на то же место.
  Оба уверены, что правы, и оба начинают раздражаться.
situations: [33, 13, 9, 8, 23]
initial:
  loyalty: 60
  safety: 90
stats:
  trust: 40
  tension: 40
characters:
  sergey:
    name: "Сергей Андреевич"
    role: "Пассажир"
    look: {top: "#56657F", bottom: "#34405A", hair: "#2B2320"}
  lyudmila:
    name: "Людмила"
    role: "Пассажирка в кресле 5А"
    look: {top: "#E8735A", bottom: "#3A4A6B", hair: "#6B3F2A", hair_style: long}
  chief:
    name: "Ольга Николаевна"
    role: "Начальник поезда"
    look: {outfit: uniform, hair: "#4A3426", hair_style: bun}
start_node: start

nodes:
  - id: start
    scene:
      background: business
      characters:
        - {id: player, position: left}
        - {id: sergey, position: center, expression: annoyed}
        - {id: lyudmila, position: right, expression: annoyed}
    situation: "Пассажир с билетом на место 5А обнаружил, что в его кресле сидит пассажирка."
    dialogue:
      - {speaker: narrator, text: "Бизнес-класс, третий вагон. До отправления пять минут."}
      - {speaker: sergey, text: "Добрый день. В моём кресле 5А сидит женщина, а у меня билет именно на него."}
      - {speaker: lyudmila, text: "Это моё место! Я его выбирала заранее, у окна."}
      - {speaker: player, thought: true, text: "Не занимать ничью сторону. Сначала — билеты."}
    choices:
      - id: check_both
        text: "«Давайте решим вопрос спокойно. Позвольте ваши билеты — я сверю номер вагона и места»"
        effects:
          loyalty: 10
          stats: {trust: 15, tension: -15}
          competences: {communication: 10, service: 5}
        reaction:
          - {speaker: sergey, expression: neutral, text: "Пожалуйста, вот."}
          - {speaker: lyudmila, expression: neutral, text: "И мой, в приложении."}
        next: tickets_checked
        best: true
        explanation: "Стандарт — не занимать сторону, внимательно проверить проездные документы обоих пассажиров и уточнить причину."
      - id: side_with_sergey
        text: "Попросить женщину освободить кресло — у мужчины же есть билет"
        effects:
          loyalty: -15
          stats: {tension: 25, trust: -10}
          competences: {communication: -10}
        reaction:
          - {speaker: lyudmila, expression: angry, text: "То есть мой билет, по-вашему, ненастоящий?!"}
        next: argument
        explanation: "Решение без проверки обоих билетов выглядит несправедливым и превращает спор в конфликт с проводником."
      - id: tell_wait
        text: "Попросить мужчину подождать в тамбуре, пока всё уляжется"
        effects:
          loyalty: -10
          stats: {tension: 15}
          competences: {service: -5}
        reaction:
          - {speaker: sergey, expression: angry, text: "Я заплатил за бизнес-класс, чтобы стоять в тамбуре?"}
        next: argument
        explanation: "Отложить вопрос — не значит решить его. Пассажиру нужно понять, что с его местом разбираются."

  - id: argument
    scene:
      background: business
      characters:
        - {id: player, position: left}
        - {id: sergey, position: center, expression: angry}
        - {id: lyudmila, position: right, expression: angry}
    situation: "Пассажиры спорят между собой всё громче, соседи начинают оборачиваться."
    dialogue:
      - {speaker: sergey, text: "Встаньте, пожалуйста, вы сидите на чужом месте!"}
      - {speaker: lyudmila, text: "Не повышайте на меня голос! Я никуда не пойду."}
      - {speaker: player, thought: true, text: "Нужно развести их, пока это не услышал весь вагон."}
    timer_seconds: 20
    timeout_next: chief_resolves
    timeout_effects: {loyalty: -15, stats: {tension: 20}}
    timeout_reaction:
      - {speaker: narrator, text: "Спор слышен в соседнем вагоне. На шум приходит начальник поезда."}
    choices:
      - id: separate
        text: "Развести коммуникацию — выслушать каждого отдельно, не занимать сторону и проверить оба билета"
        effects:
          loyalty: 10
          stats: {tension: -20, trust: 10}
          competences: {communication: 15}
        reaction:
          - {speaker: sergey, expression: neutral, text: "Хорошо, давайте разберёмся."}
        next: tickets_checked
        best: true
        explanation: "При споре пассажиров проводник разводит коммуникацию, уточняет обстоятельства и предлагает решение обеим сторонам."
      - id: raise_voice
        text: "Громко потребовать, чтобы оба немедленно успокоились"
        effects:
          loyalty: -15
          stats: {tension: 20}
          set_flags: [conflict_started]
          competences: {communication: -10}
        next: end_conflict
        explanation: "Окрик не успокаивает, а добавляет третьего участника в конфликт."

  - id: tickets_checked
    scene:
      background: business
      characters:
        - {id: player, position: left}
        - {id: sergey, position: center, expression: surprised}
        - {id: lyudmila, position: right, expression: surprised}
    situation: "Оба билета действительны и выданы на одно и то же место — сбой продажи."
    dialogue:
      - {speaker: narrator, text: "Терминал подтверждает: оба билета настоящие. Вагон 3, место 5А — оба."}
      - {speaker: lyudmila, expression: surprised, text: "Как такое вообще возможно?"}
      - {speaker: player, thought: true, text: "Это сбой продажи. Решать его я не вправе — но могу подготовить решение."}
    choices:
      - id: call_chief
        text: "«Я вижу, что ситуация требует уточнения. Сейчас я приглашу начальника поезда» — и предложить обоим напиток"
        effects:
          loyalty: 10
          safety: 5
          stats: {trust: 10, tension: -10}
          set_flags: [chief_called]
          competences: {safety_rules: 10, communication: 5}
        next: chief_resolves
        best: true
        explanation: "Два пассажира на одно место — повод пригласить начальника поезда: он уточнит сбой и примет решение о пересадке."
      - id: first_come
        text: "Объявить, что место остаётся за тем, кто сел первым"
        effects:
          loyalty: -20
          stats: {trust: -20, tension: 20}
          competences: {communication: -10, safety_rules: -5}
        reaction:
          - {speaker: sergey, expression: angry, text: "Отлично. Я напишу жалобу."}
        next: end_complaint
        explanation: "Правила «кто первый сел» нет. Проводник не решает спор сам — это делает начальник поезда по данным о сбое."
      - id: free_seats
        text: "Пока идёт начальник поезда — проверить свободные места бизнес-класса и предложить Сергею Андреевичу равноценное"
        condition: ["trust >= 50"]
        effects:
          loyalty: 15
          stats: {tension: -15}
          set_flags: [chief_called]
          competences: {service: 10}
        reaction:
          - {speaker: sergey, expression: happy, text: "Место 7А тоже у окна? Меня устроит, спасибо."}
        next: chief_resolves
        explanation: "Когда пассажиры доверяют проводнику, можно заранее подготовить решение — окончательно его подтверждает начальник поезда."

  - id: chief_resolves
    scene:
      background: business
      characters:
        - {id: player, position: left}
        - {id: chief, position: center, expression: neutral}
        - {id: lyudmila, position: right, expression: thinking}
    situation: "Начальник поезда предлагает повышение класса без доплаты; вторая пассажирка тоже хочет пересесть в первый класс."
    dialogue:
      - {speaker: chief, text: "Это сбой при продаже, приношу извинения. В первом классе есть свободное место — пересадим без доплаты."}
      - {speaker: narrator, text: "Сергей Андреевич соглашается. Людмила задумчиво смотрит ему вслед."}
      - {speaker: lyudmila, text: "А мне тоже можно в первый класс? Я готова доплатить."}
    choices:
      - id: proper_upgrade
        text: >
          «Сейчас я уточню наличие свободных мест и возможность оформления повышения класса. До подтверждения прошу
          Вас оставаться на месте, указанном в билете»
        effects:
          loyalty: 15
          safety: 5
          competences: {service: 15}
        reaction:
          - {speaker: lyudmila, expression: happy, text: "Спасибо, я подожду."}
          - {speaker: player, text: "Доплата через мобильную кассу — картой или наличными, сдача у меня есть."}
        next: end_success
        best: true
        explanation: "Повышение класса — через проверку мест и доплату в мобильной кассе. До оформления пассажир остаётся на своём месте."
      - id: promise_now
        text: "Сразу пообещать место в первом классе — наверняка что-нибудь найдётся"
        effects:
          loyalty: -10
          competences: {service: -5}
        reaction:
          - {speaker: narrator, text: "Через десять минут выясняется: свободных мест в первом классе больше нет."}
        next: end_partial
        explanation: "Обещание без проверки превращается в новое разочарование. Сначала уточнить, потом сообщить."
      - id: refuse_upgrade
        text: "Отказать: «Повышение класса в пути не делается»"
        effects:
          loyalty: -15
          competences: {service: -10}
        next: end_partial
        explanation: "Повысить класс в пути можно — при наличии мест и с доплатой через утверждённый канал."

  - id: end_success
    scene:
      background: business
      characters:
        - {id: player, position: left, expression: happy}
        - {id: lyudmila, position: right, expression: happy}
    outcome: success
    ending: "Оба пассажира довольны"
    final_text: >
      Сбой продажи урегулирован без спора: билеты проверены, начальник поезда пересадил пассажира в первый класс,
      второй пассажирке оформили повышение класса по правилам.
  - id: end_partial
    scene:
      background: business
      characters:
        - {id: player, position: left, expression: worried}
    outcome: partial
    ending: "Места распределены, но осадок остался"
    final_text: >
      Конфликт из-за места решён, но просьба о повышении класса обработана неверно — пассажирка разочарована.
  - id: end_complaint
    scene:
      background: business
      characters:
        - {id: player, position: left, expression: sad}
        - {id: sergey, position: right, expression: angry}
    outcome: failure
    ending: "Жалоба на несправедливое решение"
    final_text: >
      Проводник решил спор сам и без оснований. Пассажир с действительным билетом остался без места и оставил жалобу.
  - id: end_conflict
    scene:
      background: business
      characters:
        - {id: player, position: left, expression: sad}
        - {id: sergey, position: center, expression: angry}
        - {id: lyudmila, position: right, expression: angry}
    outcome: failure
    ending: "Скандал в бизнес-классе"
    final_text: >
      Спор перерос в скандал, в который оказался втянут и проводник. Отправление прошло под крики, пассажиры бизнес-класса недовольны.
