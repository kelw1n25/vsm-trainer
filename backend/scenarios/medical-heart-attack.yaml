# ДЕМО-КОНТЕНТ: написан командой до получения материалов кейсодержателя.
# Алгоритм действий упрощён для тренажёра и не заменяет обучение первой помощи.
id: medical-heart-attack
title: Подозрение на сердечный приступ на скорости 400 км/ч
category: medical
difficulty: 3
service_class: Эконом
route: Москва — Санкт-Петербург
demo: true
initial:
  loyalty: 70
  safety: 70
start_node: start

nodes:
  - id: start
    situation: >
      Пассажир лет шестидесяти держится за грудь, он бледный и покрыт потом.
      Жалуется, что боль отдаёт в левую руку. Жена рядом в панике.
    line:
      speaker: passenger
      name: Жена пассажира
      text: Помогите, ему очень плохо!
    timer_seconds: 15
    timeout_next: deteriorates
    timeout_effects:
      safety: -20
      loyalty: -10
    choices:
      - id: call_help
        text: >
          Усадить пассажира полусидя, расстегнуть воротник, по рации сообщить начальнику поезда
          и объявить поиск медика среди пассажиров
        effects:
          safety: 10
          loyalty: 5
          set_flags: [chief_informed]
          competences: {first_aid: 10, communication: 5}
        next: medic_search
        best: true
        explanation: >
          Боль за грудиной с отдачей в руку — повод действовать как при инфаркте. Проводник
          обеспечивает покой и сразу запускает цепочку помощи: начальник поезда, медик, скорая.
      - id: water_wait
        text: Принести воды и предложить подождать — «наверное, просто укачало»
        effects:
          safety: -20
          loyalty: -5
          competences: {first_aid: -5}
        next: deteriorates
        explanation: >
          Недооценка симптомов — самая опасная ошибка. При подозрении на инфаркт каждая
          минута промедления ухудшает прогноз.
      - id: leave_for_kit
        text: Уложить пассажира в проходе и бежать за аптечкой
        effects:
          safety: -5
          loyalty: 5
          competences: {first_aid: 5}
        next: alone_with_kit
        explanation: >
          Аптечка нужна, но пациента нельзя оставлять одного, а о ситуации никто не знает.
          Быстрее попросить соседа сходить за аптечкой и сразу вызвать помощь по рации.

  - id: alone_with_kit
    situation: Вы вернулись с аптечкой через две минуты. Пассажиру хуже, жена кричит на вас.
    line:
      speaker: passenger
      name: Жена пассажира
      text: Вы бросили его одного!
    timer_seconds: 15
    timeout_next: deteriorates
    timeout_effects:
      safety: -15
    choices:
      - id: call_now
        text: Немедленно сообщить начальнику поезда и объявить поиск медика среди пассажиров
        effects:
          safety: 5
          loyalty: -5
          set_flags: [chief_informed]
          competences: {first_aid: 5, safety_rules: 5}
        next: medic_search
        best: true
        explanation: >
          Лучше поздно, чем никогда: без начальника поезда нельзя организовать остановку
          и встречу скорой на станции.
      - id: give_pills
        text: Самостоятельно дать пассажиру таблетки из аптечки
        effects:
          safety: -15
          competences: {first_aid: -10, safety_rules: -10}
        next: deteriorates
        explanation: >
          Проводник не назначает лекарства: у пассажира могут быть противопоказания
          и аллергия. Решение о препаратах принимает медик.

  - id: medic_search
    situation: >
      Среди пассажиров нашёлся врач-терапевт. До ближайшей станции 12 минут,
      до конечной — около часа.
    line:
      speaker: train_chief
      name: Начальник поезда
      text: Докладывай. Останавливаемся на ближайшей станции или едем до конечной?
    timer_seconds: 20
    timeout_next: deteriorates
    timeout_effects:
      safety: -15
    choices:
      - id: request_stop
        text: >
          Передать слова врача: подозрение на инфаркт, нужна остановка на ближайшей станции
          и скорая к платформе
        effects:
          safety: 15
          loyalty: -5
          set_flags: [ambulance_requested]
          competences: {first_aid: 10, safety_rules: 10}
        next: waiting
        best: true
        explanation: >
          Жизнь пассажира важнее графика. Остальные пассажиры будут недовольны задержкой —
          поэтому лояльность немного падает, — но это правильная цена.
      - id: continue_trip
        text: Не останавливаться — «до конечной всего час, не будем задерживать 400 человек»
        effects:
          loyalty: 10
          safety: -25
          competences: {safety_rules: -10}
        next: deteriorates
        explanation: >
          Остальные пассажиры довольны, но при инфаркте час без помощи может стоить жизни.
          Удобство большинства не оправдывает риск для одного.
      - id: ask_doctor_decide
        text: Попросить врача-пассажира самому связаться с начальником поезда и решить, что делать
        effects:
          safety: -5
          set_flags: [ambulance_requested]
          competences: {communication: -5}
        next: waiting
        explanation: >
          Врач поможет, но передавать решения и связь по рации — задача экипажа.
          Пока врача вводят в курс дела, теряются минуты.

  - id: deteriorates
    situation: Пассажир теряет сознание и перестаёт нормально дышать.
    timer_seconds: 10
    timeout_next: final_fail
    timeout_effects:
      safety: -30
    choices:
      - id: start_cpr
        text: >
          Начать сердечно-лёгочную реанимацию, попросить соседа принести автоматический
          дефибриллятор и сообщить начальнику поезда
        effects:
          safety: 15
          set_flags: [chief_informed]
          competences: {first_aid: 15, stress_resistance: 5}
        next: aed
        best: true
        explanation: >
          При остановке дыхания счёт идёт на секунды: реанимацию начинают сразу,
          параллельно поручая другим людям принести дефибриллятор и вызвать помощь.
      - id: wait_medic
        text: Ждать, пока придёт медик
        effects:
          safety: -30
          competences: {first_aid: -10}
        next: final_fail
        explanation: >
          Без реанимации в первые минуты шансы резко падают. Начинать нужно,
          не дожидаясь медика.

  - id: aed
    situation: Дефибриллятор принесли. Прибор анализирует сердечный ритм и даёт голосовые подсказки.
    timer_seconds: 20
    timeout_next: final_fail
    timeout_effects:
      safety: -20
    choices:
      - id: follow_aed
        text: >
          Следовать подсказкам прибора и продолжать реанимацию до прибытия медиков,
          а начальник поезда запрашивает остановку и скорую
        effects:
          safety: 20
          set_flags: [ambulance_requested]
          competences: {first_aid: 15, safety_rules: 10}
        next: waiting
        best: true
        explanation: >
          Автоматический дефибриллятор рассчитан на людей без медицинского образования:
          достаточно точно выполнять его команды и не прерывать реанимацию надолго.
      - id: stop_cpr
        text: Прекратить реанимацию и не возобновлять — «прибор всё сделает сам»
        effects:
          safety: -25
          competences: {first_aid: -10}
        next: final_fail
        explanation: >
          Прибор только анализирует ритм и даёт разряд. Между разрядами реанимацию
          продолжает человек, иначе кровоток останавливается.

  - id: waiting
    situation: Поезд прибывает на станцию, бригада скорой помощи ждёт на платформе.
    choices:
      - id: handover
        condition:
          - safety >= 50
        text: >
          Передать пассажира врачам и коротко рассказать: когда начались симптомы,
          что делали, какие препараты давали
        effects:
          safety: 10
          loyalty: 10
          competences: {first_aid: 10, communication: 10}
        next: final_success
        best: true
        explanation: >
          Короткая и точная передача информации экономит врачам время на диагностику.
          Вариант доступен, если ситуация не была доведена до критической.
      - id: handover_basic
        text: Помочь вынести пассажира и вернуться к работе
        effects:
          safety: 5
          competences: {first_aid: 5}
        next: final_partial
        explanation: >
          Пассажир у врачей, но они не знают, что происходило в поезде, и тратят время
          на расспросы родственников.

  - id: final_success
    outcome: success
    final_text: >
      Пассажир передан скорой вовремя. Врачи говорят, что счёт шёл на минуты и
      действия экипажа спасли ему жизнь.

  - id: final_partial
    outcome: partial
    final_text: >
      Пассажир передан медикам, но было потеряно драгоценное время.
      Прогноз осторожный, будет служебный разбор.

  - id: final_fail
    outcome: failure
    final_text: >
      Помощь опоздала. Служебная проверка установит, почему экипаж не действовал по алгоритму.
