# Правила игры. Меняются без изменения кода, применяются после перезапуска backend.

# Код компетенции → название для интерфейса.
# Коды используются в сценариях: effects.competences.<код>
competences:
  communication: Коммуникация и деэскалация конфликтов
  first_aid: Первая помощь и медицинские ситуации
