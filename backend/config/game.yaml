# Правила игры. Меняются без изменения кода, применяются после перезапуска backend.

# Код компетенции → название для интерфейса.
# Коды используются в сценариях: effects.competences.<код>
competences:
  communication: Коммуникация и деэскалация конфликтов
  first_aid: Первая помощь и медицинские ситуации
  safety_rules: Безопасность и регламенты
  service: Сервис и стандарты обслуживания
  stress_resistance: Стрессоустойчивость и скорость решений

timer:
  # Ответ, пришедший позже таймера не больше чем на столько секунд, ещё принимается:
  # компенсирует задержку сети. Позже — срабатывает timeout_next.
  answer_grace_seconds: 1.0

scoring:
  # XP за сценарий = xp_by_outcome × difficulty_multiplier + итоговые шкалы × scale_weights
  xp_by_outcome:
    success: 100
    partial: 50
    failure: 10
  difficulty_multiplier:
    1: 1.0
    2: 1.5
    3: 2.0
  scale_weights:
    loyalty: 0.3
    safety: 0.3
  # Решение в первой трети таймера даёт очки стрессоустойчивости
  fast_answer:
    timer_fraction: 0.33
    competence: stress_resistance
    points: 3

# Сгорание баллов: если inactive_days дней нет прохождений, сгорает burn_fraction XP,
# и так за каждые следующие inactive_days дней. Предупреждение — за warn_days_before дней.
points_burn:
  inactive_days: 7
  burn_fraction: 0.1
  warn_days_before: 2

# Челлендж недели: успешное прохождение сценария даёт бонус один раз за календарную неделю
weekly_challenge:
  scenario_id: business-seat-conflict
  bonus_xp: 50

# Уровни: минимальный XP для каждого уровня (по возрастанию, первый — с 0)
levels:
  - {level: 1, title: Стажёр, xp: 0}
  - {level: 2, title: Проводник, xp: 300}
  - {level: 3, title: Старший проводник, xp: 800}
  - {level: 4, title: Мастер сервиса, xp: 1600}
  - {level: 5, title: Наставник, xp: 3000}

# Достижения. Типы правил:
#   fast_streak     — count решений подряд быстрее timer_fraction таймера (таймаут обрывает серию)
#   scenario_result — итог сценария: category, outcomes, loyalty_above, safety_above,
#                     no_timeouts, scales_never_below (все указанные условия должны выполниться)
#   runs_completed  — всего пройдено count сценариев
#   categories_covered — успех или частичный успех в count разных категориях ситуаций
#   competence_total — набрано points очков компетенции competence
achievements:
  first_trip:
    title: Первый рейс
    description: Пройден первый сценарий
    rule: {type: runs_completed, count: 1}
  seasoned:
    title: Опытный проводник
    description: Пройдено 10 сценариев
    rule: {type: runs_completed, count: 10}
  all_rounder:
    title: Универсал
    description: Справился с ситуациями всех четырёх типов
    rule: {type: categories_covered, count: 4}
  communicator:
    title: Мастер коммуникации
    description: 100 очков компетенции «Коммуникация и деэскалация конфликтов»
    rule: {type: competence_total, competence: communication, points: 100}
  rules_expert:
    title: Знаток регламентов
    description: 100 очков компетенции «Безопасность и регламенты»
    rule: {type: competence_total, competence: safety_rules, points: 100}
  cool_head:
    title: Хладнокровие
    description: 5 решений подряд в первой трети таймера
    rule: {type: fast_streak, count: 5, timer_fraction: 0.33}
  guardian_angel:
    title: Ангел-хранитель
    description: Медицинский сценарий пройден с безопасностью выше 80
    rule: {type: scenario_result, category: medical, outcomes: [success, partial], safety_above: 80}
  diplomat:
    title: Дипломат
    description: Конфликт завершён с лояльностью выше 90
    rule: {type: scenario_result, category: conflict, outcomes: [success, partial], loyalty_above: 90}
  flawless:
    title: Без права на ошибку
    description: Сценарий пройден без истечения таймера и падения шкал ниже 50
    rule: {type: scenario_result, outcomes: [success], no_timeouts: true, scales_never_below: 50}
